services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shift-happens}
      POSTGRES_DB: shifthappens
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shift -d shifthappens"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://shift:${POSTGRES_PASSWORD:-shift-happens}@db:5432/shifthappens
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  pgdata:
